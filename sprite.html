<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZX-KIT Sprite — Big Ears Bunny</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #111;
        color: #00cd00;
        font-family: 'Courier New', Courier, monospace;
      }
      .wrap {
        text-align: center;
      }
      h1 {
        color: #00cdcd;
        letter-spacing: 0.08em;
      }
      canvas {
        image-rendering: pixelated;
        border: 4px solid #00cd00;
      }
      p {
        max-width: 768px;
        margin: 14px auto 0;
        color: #cdcd00;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>BIG EARS BUNNY — 16×24</h1>
      <canvas id="screen"></canvas>
      <p>
        Animovaný zx-kit sprite z textovej mriežky (createBitmapFromRows → drawBitmap). Hore zajac stojí a žmurká
        (idle), dole prechádza cez plátno (walk: 3-beat nohy + odraz). Štyri farebné vrstvy: telo / bruško / uši / oči.
      </p>
    </div>
    <script type="module" src="scripts/bunny.js"></script>
  </body>
</html>
